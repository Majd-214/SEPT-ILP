# SEPT Interactive Laboratory Platform — the whole Phase A stack.
#
#   docker compose up --build
#
# then:
#   http://localhost:8080          → student site (nothing published yet → publish first)
#   http://localhost:8080/login    → faculty console
#   http://localhost:8025          → Mailpit (magic-link emails land here)
#
# The repository is bind-mounted: the editor's Apply commits into this
# working copy, publishes build from it, and Git stays the single
# source of truth on the host.

services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.platform
    environment:
      DATA_DIR: /data
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: sept-ilp@localhost
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-secret-change-me-in-any-real-deployment}
      SEED_ADMIN: ${SEED_ADMIN:-admin@demo}
      SEED_INSTRUCTOR: ${SEED_INSTRUCTOR:-instructor@demo}
    volumes:
      - ..:/app
      - platform-data:/data
    expose:
      - "3000"
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI; SMTP stays internal on 1025
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - platform-data:/data:ro
    depends_on:
      - platform
    restart: unless-stopped

volumes:
  platform-data:
