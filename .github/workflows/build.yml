name: Build

on:
  push:
    branches: [main]
  pull_request:

# The pipeline IS the publishing path: every push runs schema validation,
# rendering, and all quality gates. A gate failure fails the build.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (accessibility gate)
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Build sample course through all quality gates
        run: npm run gates

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  # Publish the rendered sample course to GitHub Pages (main branch only).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
